name: Keep Supabase Awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase database
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tournaments?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
